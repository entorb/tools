---
$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
version: '0.2'
useCache: true
useGitignore: true
dictionaryDefinitions:
  - name: cspell-words
    path: cspell-words.txt
    addWords: true
dictionaries:
  - cspell-words
language: en-US
ignorePaths:
  - .*
  - /.vscode/
  - biome.json
  - cspell-words.txt
  - cspell.config.yaml
  - LICENSE
  - package*.json
  - photo_SyncShrink-old.pl
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - pyproject.toml
  - requirements.txt
  - uv.lock
