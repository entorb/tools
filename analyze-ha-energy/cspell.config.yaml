---
$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
version: '0.2'
useGitignore: true
language: en-US
dictionaryDefinitions:
  - name: cspell-words
    path: ./cspell-words.txt
    addWords: true
dictionaries:
  - cspell-words
ignorePaths:
  - .*
  - biome.json
  - build
  - cspell-words.txt
  - cspell.config.yaml
  - dist
  - LICENSE
  - node_modules
  - package*.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - pyproject.toml
  - requirements.txt
  - uv.lock
